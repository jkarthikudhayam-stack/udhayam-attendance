name: Repair Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Regenerate official wrapper jar + scripts
        run: gradle wrapper

      - name: Verify wrapper files generated
        run: ls -lh gradle/wrapper/

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push repaired wrapper
        run: |
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          git status
          if ! git diff-index --quiet HEAD; then
            git commit -m "Repair Gradle wrapper - regenerate jar"
            git push origin main
          else
            echo "No changes to commit"
          fi