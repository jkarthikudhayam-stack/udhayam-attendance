name: Repair Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle matching your project's declared version
        uses: gradle/actions/setup-gradle@v6
        with:
  gradle-version: '9.3.1'

      - name: Regenerate official wrapper jar + scripts
        run: gradle wrapper

      - name: Commit repaired wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          git commit -m "Repair Gradle wrapper" || echo "nothing to commit"
          git push